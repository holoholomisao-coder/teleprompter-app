<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>テレプロンプター</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101112; color: #fafafa; --accent: #b8f39d; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1440px; margin: auto; padding: clamp(16px, 4vw, 48px); }
    h1 { font-size: clamp(24px, 4vw, 36px); margin: 0 0 24px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr); gap: 16px; }
    #player, .panel { background: #191b1d; border: 1px solid #363a3d; border-radius: 14px; overflow: hidden; }
    #player { display: flex; flex-direction: column; min-width: 0; }
    #stage { position: relative; height: clamp(290px, 60vh, 720px); overflow: hidden; background: #000; }
    #stage::before { content: ''; position: absolute; inset: 50% 0 auto; border-top: 2px solid var(--accent); pointer-events: none; }
    #stage.mirror #script { scale: -1 1; }
    #script { position: absolute; inset: 0 0 auto; padding: 0 7%; color: #fff; font-size: 54px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
    #placeholder { position: absolute; inset: 0; place-content: center; padding: 24px; text-align: center; color: #b6bbbe; }
    #placeholder:not([hidden]) { display: grid; }
    #placeholder span { background: #000; padding: 4px 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px; }
    .sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; padding: 0 12px 12px; }
    .sliders .field { margin-bottom: 0; }
    button { padding: 9px 13px; border-radius: 8px; border: 1px solid #494f52; background: #25282a; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #363a3d; }
    #play { background: var(--accent); color: #10230b; border-color: var(--accent); font-weight: 700; }
    #play:hover:not(:disabled) { background: #d0ffba; }
    button:disabled { opacity: .48; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .panel { padding: 18px; }
    .field { display: grid; gap: 8px; margin-bottom: 16px; }
    .field label { display: flex; justify-content: space-between; gap: 8px; }
    output { color: var(--accent); white-space: nowrap; }
    textarea { width: 100%; min-height: 180px; resize: vertical; padding: 12px; color: inherit; background: #111213; border: 1px solid #494f52; border-radius: 8px; font: inherit; }
    input { accent-color: var(--accent); }
    #status, #storage { color: #b6bbbe; font-size: 13px; margin: 0; }
    #player:fullscreen { border: 0; border-radius: 0; }
    #player:fullscreen #stage { height: auto; flex: 1; }
    @media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>テレプロンプター</h1>
    <div class="workspace">
      <section id="player" aria-label="原稿の表示と再生">
        <div class="toolbar">
          <button type="button" id="play">スタート</button>
          <button type="button" id="pause">一時停止</button>
          <button type="button" id="reset">先頭に戻す</button>
          <button type="button" id="fullscreen">全画面表示</button>
          <p id="status" role="status">スペースキーで再生・一時停止</p>
        </div>
        <div class="sliders">
          <div class="field">
            <label for="speed">スクロール速度 <output id="speedValue" for="speed">65 px/秒</output></label>
            <input id="speed" type="range" min="10" max="300" value="65">
          </div>
          <div class="field">
            <label for="size">文字の大きさ <output id="sizeValue" for="size">54 px</output></label>
            <input id="size" type="range" min="20" max="120" value="54">
          </div>
        </div>
        <div id="stage">
          <div id="placeholder"><span>原稿を入力して「スタート」を押してください。</span></div>
          <div id="script"></div>
        </div>
      </section>
      <section class="panel" aria-label="原稿と表示設定">
        <div class="field">
          <label for="editor">原稿</label>
          <textarea id="editor" placeholder="ここに原稿を貼り付けてください" spellcheck="false" autocomplete="off" autocorrect="off" aria-describedby="storage"></textarea>
          <p id="storage" role="status">原稿はこのブラウザに保存されます。</p>
        </div>
        <label><input id="mirror" type="checkbox"> ミラー表示（左右反転）</label>
      </section>
    </div>
  </main>
  <script>
    const byId = (id) => document.getElementById(id);
    const editor = byId('editor');
    const player = byId('player');
    const stage = byId('stage');
    const script = byId('script');
    const play = byId('play');
    const pause = byId('pause');
    const speed = byId('speed');
    const size = byId('size');
    const status = byId('status');
    const fullscreen = byId('fullscreen');
    const storageKey = 'teleprompter.script';
    const shortcutHint = 'スペースキーで再生・一時停止';
    let distance = 0;
    let playing = false;
    let finished = false;
    let previousTime = null;
    let frameId = null;

    function reportStorageError() {
      byId('storage').textContent = 'このブラウザでは原稿を保存できません。';
    }

    function startPosition() {
      return stage.clientHeight * 0.78;
    }

    function draw() {
      script.style.transform = `translateY(${startPosition() - distance}px)`;
    }

    function updateButtons() {
      play.disabled = playing || !editor.value.trim();
      pause.disabled = !playing;
    }

    function stop(message) {
      playing = false;
      if (frameId !== null) cancelAnimationFrame(frameId);
      frameId = null;
      previousTime = null;
      status.textContent = message;
      updateButtons();
    }

    function reset() {
      distance = 0;
      finished = false;
      stop(shortcutHint);
      draw();
    }

    function tick(time) {
      if (previousTime !== null) {
        const elapsed = Math.min(time - previousTime, 50) / 1000;
        distance += speed.valueAsNumber * elapsed;
      }
      previousTime = time;
      const end = startPosition() + script.offsetHeight;
      if (distance >= end) {
        distance = end;
        finished = true;
        stop('原稿の終わりです。');
        draw();
        return;
      }
      draw();
      frameId = requestAnimationFrame(tick);
    }

    function start() {
      if (playing || !editor.value.trim()) return;
      if (finished) reset();
      playing = true;
      status.textContent = '再生中';
      updateButtons();
      frameId = requestAnimationFrame(tick);
    }

    function refreshScript() {
      const hasScript = Boolean(editor.value.trim());
      script.textContent = hasScript ? editor.value : '';
      byId('placeholder').hidden = hasScript;
      reset();
    }

    try {
      editor.value = localStorage.getItem(storageKey) ?? '';
    } catch {
      reportStorageError();
    }
    editor.addEventListener('input', () => {
      refreshScript();
      try {
        localStorage.setItem(storageKey, editor.value);
        byId('storage').textContent = '原稿はこのブラウザに保存されます。';
      } catch {
        reportStorageError();
      }
    });
    play.addEventListener('click', start);
    pause.addEventListener('click', () => stop('一時停止中'));
    byId('reset').addEventListener('click', reset);
    speed.addEventListener('input', () => {
      byId('speedValue').value = `${speed.value} px/秒`;
    });
    size.addEventListener('input', () => {
      script.style.fontSize = `${size.value}px`;
      byId('sizeValue').value = `${size.value} px`;
    });
    byId('mirror').addEventListener('change', (event) => {
      stage.classList.toggle('mirror', event.target.checked);
    });
    fullscreen.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await player.requestFullscreen();
        status.textContent = playing ? '再生中' : shortcutHint;
      } catch {
        status.textContent = '全画面表示を切り替えられませんでした。';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      fullscreen.textContent = document.fullscreenElement ? '全画面を終了' : '全画面表示';
      draw();
    });
    document.addEventListener('keydown', (event) => {
      if (event.code !== 'Space' || event.isComposing || event.ctrlKey ||
          event.altKey || event.metaKey || event.shiftKey ||
          event.target.closest('textarea, input, #fullscreen')) return;
      event.preventDefault();
      if (event.repeat) return;
      if (playing) stop('一時停止中');
      else start();
    });
    window.addEventListener('resize', draw);
    refreshScript();
  </script>
</body>
</html>
